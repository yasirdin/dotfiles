# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using | and -
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# Don't rename windows automatically
set-option -g allow-rename off

# Automatically reorder window numbers
set-option -g renumber-windows on

# New tmux windows go to home directory
bind c new-window -c "$HOME"

# New pane goes to current working directory
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Equalize pane sizes while keeping the current arrangement
bind = select-layout -E

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Save/restore tmux sessions: prefix + Ctrl-s to save, prefix + Ctrl-r to restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Auto-save sessions periodically and auto-restore on tmux start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Bring back clear screen under tmux prefix
bind C-l send-keys 'C-l'

# CPU and memory usage on the right of the status bar
set-option -g status-right ' #(~/.tmux/status-right.sh) '
set-option -g status-interval 5

set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Move tmux windows with ctrl+shift+direction
# https://superuser.com/a/552493
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Vi mode for copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Mouse selection: copy to the macOS clipboard on drag-release and KEEP the
# highlight. Default MouseDragEnd binding is copy-pipe-and-cancel, whose cancel
# exits copy-mode and clears the selection the instant you let go; copy-pipe
# (no cancel) pipes to pbcopy and leaves the selection visible (press q/Esc to
# exit copy-mode). mouse on is set here so it persists across server restarts.
set -g mouse on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy" \; display-message -d 500 "✓ Copied to clipboard"
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy" \; display-message -d 500 "✓ Copied to clipboard"

# Pane border colors (solarized)
set -g pane-border-style 'fg=#586e75'
set -g pane-active-border-style 'fg=#b58900'
set -g pane-border-indicators 'colour'

# Solarized status bar; current window as a solid yellow block, matching the
# active pane border so "active" is the same color everywhere
set -g status-style 'bg=#073642,fg=#839496'
set -g window-status-format ' #I #W '
set -g window-status-style 'fg=#586e75'
set -g window-status-current-format ' #I #W '
set -g window-status-current-style 'fg=#073642,bg=#b58900,bold'
set -g window-status-bell-style 'fg=#dc322f,bold'

# Initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
